name = "riemann2"
srcDir = "formalization"
defaultTargets = ["Challenge", "Solution", "Utilities"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
globs = ["Solution", "Riemann.+"]

[[lean_lib]]
name = "Utilities"
globs = ["Utilities", "Utilities.+"]
